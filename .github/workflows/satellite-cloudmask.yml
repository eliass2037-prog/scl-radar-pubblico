name: Satellite Cloud Mask Locarno
on:
  workflow_dispatch:
  # Legacy WMS color interpretation disabled; use RSS-CLM GRIB2 workflow.
permissions:
  contents: write
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pillow
      - name: Elabora copertura satellitare
        run: python3 cloudmask_locarno.py
      - name: Pubblica cloud.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.json
          if ! git diff --cached --quiet; then
            git commit -m "Update satellite cloud mask"
            git pull --rebase
            git push
          fi
