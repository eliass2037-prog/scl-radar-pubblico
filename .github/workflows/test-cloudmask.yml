
name: Test Cloud Mask Locarno

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-satellite:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa librerie
        run: python3 -m pip install requests pillow

      - name: Verifica dati satellitari
        run: python3 test_cloudmask_locarno.py

      
      - name: Salva immagini satellitari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immagini-satellite-locarno
          path: |
            test_satellite_output/cloudmask_locarno.png
            test_satellite_output/cloudmask_legend.png
            test_satellite_output/report.json
          if-no-files-found: error

