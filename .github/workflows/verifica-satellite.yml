name: Verifica satellite Locarno (senza modificare radar)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica EUMETView
        run: python3 verifica_satellite_locarno.py
      - name: Conserva diagnostica anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostica-satellite
          path: diagnostica_satellite.json
