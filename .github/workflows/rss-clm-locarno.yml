name: EUMETSAT RSS-CLM GRIB2 Locarno
on:
  push:
    paths:
      - 'rss_clm_locarno.py'
      - '.github/workflows/rss-clm-locarno.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: rss-clm-locarno
  cancel-in-progress: false
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official EUMETSAT client and GRIB decoder
        run: python3 -m pip install eumdac eccodes numpy
      - name: Download and decode real cloud mask
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: python3 rss_clm_locarno.py
      - name: Publish validated cloud.json or explicit unavailable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified EUMETSAT RSS-CLM cloud mask"
            git pull --rebase
            git push
          fi
